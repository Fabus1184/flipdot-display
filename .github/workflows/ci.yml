name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: firmware/core (host tests)
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml asks for the ESP toolchain; host tests run on stable
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  firmware:
    name: firmware (ESP32 build)
    runs-on: ubuntu-latest
    env:
      FLIPDOT_CONFIG: config.example.toml
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32
          ldproxy: false
      - run: cargo firmware-clippy -- -D warnings
      - run: cargo firmware

  hardware:
    name: hardware (KiCad ERC/DRC, fabrication outputs)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.7
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Check and export flipdot-driver (Rev 2.1)
        run: hardware/export.sh flipdot-driver
      - name: Check and export flipdot-driver-rev1.2
        run: hardware/export.sh flipdot-driver-rev1.2
      - uses: actions/upload-artifact@v4
        with:
          name: hardware-outputs
          path: hardware/kicad/*/output/
