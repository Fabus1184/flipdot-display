<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="380" viewBox="0 0 1160 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c5221f"/>
    </marker>
    <style>
      .frame { fill: none; stroke: #9aa0a6; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .ftitle { font-size: 13px; fill: #5f6368; font-weight: 600; letter-spacing: .04em; }
      .box { fill: #fff; stroke: #333; stroke-width: 1.5; }
      .t { font-size: 14px; fill: #202124; font-weight: 600; text-anchor: middle; }
      .s { font-size: 12px; fill: #5f6368; text-anchor: middle; }
      .w { fill: none; stroke: #333; stroke-width: 1.4; }
      .pw { fill: none; stroke: #c5221f; stroke-width: 1.6; }
      .l { font-size: 11px; fill: #5f6368; }
      .lp { font-size: 11px; fill: #c5221f; }
      .bus { stroke: #333; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="1160" height="380" fill="#fff"/>

  <!-- frames -->
  <rect class="frame" x="20" y="20" width="780" height="340" rx="8"/>
  <text class="ftitle" x="34" y="40">DRIVER BOARD</text>
  <rect class="frame" x="870" y="20" width="270" height="340" rx="8"/>
  <text class="ftitle" x="884" y="40">FLIPDOT PANEL</text>

  <!-- boxes -->
  <rect class="box" x="45" y="65" width="125" height="50" rx="3"/>
  <text class="t" x="107" y="87">USB-C</text><text class="s" x="107" y="104">5 V input</text>

  <rect class="box" x="245" y="65" width="150" height="50" rx="3"/>
  <text class="t" x="320" y="87">XL6019 boost</text><text class="s" x="320" y="104">+HV, 16–25 V</text>

  <rect class="box" x="45" y="205" width="125" height="70" rx="3"/>
  <text class="t" x="107" y="236">ESP32</text><text class="s" x="107" y="253">DevKit</text>

  <rect class="box" x="245" y="215" width="150" height="50" rx="3"/>
  <text class="t" x="320" y="237">4 × 74HC595</text><text class="s" x="320" y="254">32 enable bits</text>

  <rect class="box" x="480" y="155" width="125" height="50" rx="3"/>
  <text class="t" x="542" y="177">2 × ULN2803A</text><text class="s" x="542" y="194">level shift</text>

  <rect class="box" x="660" y="155" width="125" height="50" rx="3"/>
  <text class="t" x="722" y="177">High side</text><text class="s" x="722" y="194">16 × AO3401A</text>

  <rect class="box" x="660" y="275" width="125" height="50" rx="3"/>
  <text class="t" x="722" y="297">Low side</text><text class="s" x="722" y="314">16 × AO3400A</text>

  <rect class="box" x="895" y="65" width="220" height="60" rx="3"/>
  <text class="t" x="1005" y="90">FP2800A</text><text class="s" x="1005" y="108">column driver, 1 of 28</text>

  <rect class="box" x="895" y="230" width="220" height="95" rx="3"/>
  <text class="t" x="1005" y="270">Coil matrix</text><text class="s" x="1005" y="288">28 × 16 coils, 2 diodes each</text>

  <!-- coil supply -->
  <path class="pw" d="M170 90 H243" marker-end="url(#r)"/>
  <path class="pw" d="M395 90 H893" marker-end="url(#r)"/>
  <circle cx="722" cy="90" r="3.2" fill="#c5221f"/>
  <path class="pw" d="M722 90 V153" marker-end="url(#r)"/>
  <text class="lp" x="410" y="83">+HV</text>
  <text class="lp" x="728" y="128">+HV</text>

  <!-- ESP32 to shift registers -->
  <path class="w" d="M170 240 H243" marker-end="url(#a)"/>
  <line class="bus" x1="200" y1="246" x2="210" y2="234"/><text class="l" x="212" y="232">4</text>

  <!-- enables -->
  <path class="w" d="M395 230 H430 V180 H478" marker-end="url(#a)"/>
  <line class="bus" x1="450" y1="186" x2="460" y2="174"/><text class="l" x="462" y="172">16</text>
  <text class="l" x="434" y="216">HSS_EN</text>
  <path class="w" d="M605 180 H658" marker-end="url(#a)"/>
  <text class="l" x="612" y="198">HSD</text>
  <line class="bus" x1="625" y1="186" x2="635" y2="174"/><text class="l" x="637" y="172">16</text>
  <path class="w" d="M395 250 H430 V300 H658" marker-end="url(#a)"/>
  <line class="bus" x1="540" y1="306" x2="550" y2="294"/><text class="l" x="552" y="292">16</text>
  <text class="l" x="436" y="316">LSS_EN</text>

  <!-- rows -->
  <path class="w" d="M785 180 H835 V255 H893" marker-end="url(#a)"/>
  <line class="bus" x1="812" y1="186" x2="822" y2="174"/><text class="l" x="824" y="172">16</text>
  <text class="l" x="839" y="222" font-size="10.5">row B</text>
  <path class="w" d="M785 300 H893" marker-end="url(#a)"/>
  <line class="bus" x1="812" y1="306" x2="822" y2="294"/><text class="l" x="824" y="292">16</text>
  <text class="l" x="839" y="318" font-size="10.5">row A</text>

  <!-- ESP32 to FP2800A -->
  <path class="w" d="M107 205 V140 H850 V110 H893" marker-end="url(#a)"/>
  <line class="bus" x1="300" y1="146" x2="310" y2="134"/><text class="l" x="312" y="132">7</text>
  <text class="l" x="330" y="132">FP_A0–A2, FP_B0–B1, DATA, EN</text>

  <!-- columns -->
  <path class="w" d="M1005 125 V228" marker-end="url(#a)"/>
  <line class="bus" x1="999" y1="182" x2="1011" y2="170"/><text class="l" x="1015" y="180">28 columns</text>

  <!-- legend -->
  <line class="pw" x1="45" y1="342" x2="75" y2="342"/><text class="l" x="82" y="346">coil supply</text>
  <line class="w" x1="160" y1="342" x2="190" y2="342"/><text class="l" x="197" y="346">logic and drive</text>
  <line class="bus" x1="300" y1="348" x2="310" y2="336"/><text class="l" x="316" y="346">bus width</text>
</svg>
